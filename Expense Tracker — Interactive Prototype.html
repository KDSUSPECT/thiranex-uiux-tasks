<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Expense Tracker — Interactive Prototype</title>
<style>
  :root {
    --bg: #f4ede4;
    --panel: #ffffff;
    --accent: #3a2a20;
    --muted: #8a7a6e;
    --ring: #c65d3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1917;
      --panel: #2a2522;
      --accent: #f3ece4;
      --muted: #b4a89c;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1917;
    --panel: #2a2522;
    --accent: #f3ece4;
    --muted: #b4a89c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--accent);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    overflow-x: hidden;
  }
  .wrap {
    display: flex; flex-direction: column; align-items: center;
    padding: 28px 16px 40px;
    min-height: 100%;
  }
  h1 { font-size: 20px; margin: 0 0 4px; text-align: center; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 20px; text-align: center; max-width: 420px; }
  .stage {
    position: relative;
    width: min(375px, 92vw);
    aspect-ratio: 375 / 812;
    border-radius: 34px;
    overflow: hidden;
    box-shadow: 0 18px 50px rgba(0,0,0,0.18);
    background: var(--panel);
    border: 1px solid rgba(0,0,0,0.06);
  }
  .screen {
    position: absolute; inset: 0;
    transition: transform 320ms cubic-bezier(.4,0,.2,1), opacity 320ms ease;
  }
  .screen img {
    width: 100%; height: 100%; display: block; object-fit: cover;
  }
  .hotspot {
    position: absolute;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .hotspot:active { background: rgba(198,93,59,0.12); }
  .hotspot.debug { outline: 1px dashed rgba(255,0,0,0.4); }
  .chip-ring {
    position: absolute;
    border: 2px solid var(--ring);
    border-radius: 999px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 150ms ease;
  }
  .chip-ring.active { opacity: 1; }
  .toast {
    position: fixed;
    left: 50%; bottom: calc(28px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%) translateY(20px);
    background: var(--accent);
    color: var(--bg);
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 200ms ease, transform 200ms ease;
    white-space: nowrap;
    z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .controls {
    margin-top: 18px;
    display: flex; gap: 10px; align-items: center;
  }
  .btn {
    border: 1px solid rgba(0,0,0,0.15);
    background: var(--panel);
    color: var(--accent);
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 13px;
    cursor: pointer;
  }
  .crumbs { margin-top: 10px; font-size: 11px; color: var(--muted); text-align: center; max-width: 360px; }
  .slide-left-enter { transform: translateX(100%); opacity: 0; }
  .slide-left-exit { transform: translateX(-30%); opacity: 0; }
  .slide-right-enter { transform: translateX(-100%); opacity: 0; }
  .slide-right-exit { transform: translateX(30%); opacity: 0; }
  .center { transform: translateX(0); opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Expense Tracker — Interactive Prototype</h1>
  <p class="sub">Tap the highlighted areas to move through the flow: onboarding → sign up → log an expense → view your spending report.</p>
  <div class="stage" id="stage"></div>
  <div class="controls">
    <button class="btn" onclick="goTo('onboarding', 'right')">Restart</button>
    <button class="btn" onclick="toggleDebug()">Show tap zones</button>
  </div>
  <p class="crumbs" id="crumbs"></p>
</div>
<div class="toast" id="toast"></div>

let current = null;

function toggleDebug(){
  debugOn = !debugOn;
  document.querySelectorAll('.hotspot').forEach(h => h.classList.toggle('debug', debugOn));
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
}

// pct helper: convert design-space coords (375x812) to percentages
function pct(x,y,w,h){
  return {
    left: (x/375*100)+'%',
    top: (y/812*100)+'%',
    width: (w/375*100)+'%',
    height: (h/812*100)+'%'
  };
}

function hs(x,y,w,h,onclick){
  const d = document.createElement('div');
  d.className = 'hotspot';
  const s = pct(x,y,w,h);
  Object.assign(d.style, s);
  d.addEventListener('click', onclick);
  return d;
}

function setChip(el, rectArr, clearOnly){
  const stage = document.getElementById('stage');
  let ring = stage.querySelector('.chip-ring');
  if (!ring){
    ring = document.createElement('div');
    ring.className = 'chip-ring';
    stage.appendChild(ring);
  }
  if (clearOnly || !el){
    ring.classList.remove('active');
    return;
  }
  const s = pct(rectArr[0]-3, rectArr[1]-3, rectArr[2]+6, rectArr[3]+6);
  Object.assign(ring.style, s);
  ring.classList.add('active');
}

const crumbNames = { onboarding:'Welcome', signup:'Sign Up', dashboard:'Home', addExpense:'Add Expense', reports:'Reports' };
let trail = [];

function goTo(name, dir){
  const stage = document.getElementById('stage');
  const def = screens[name];

  const newScreen = document.createElement('div');
  newScreen.className = 'screen';
  const img = document.createElement('img');
  img.src = 'data:image/png;base64,' + IMAGES[def.img];
  newScreen.appendChild(img);
  def.build(newScreen);

  newScreen.classList.add(dir === 'left' ? 'slide-left-enter' : 'slide-right-enter');
  stage.appendChild(newScreen);
  // force reflow
  void newScreen.offsetWidth;

  const old = current;
  requestAnimationFrame(() => {
    newScreen.classList.remove('slide-left-enter','slide-right-enter');
    newScreen.classList.add('center');
    if (old){
      old.classList.remove('center');
      old.classList.add(dir === 'left' ? 'slide-left-exit' : 'slide-right-exit');
      setTimeout(() => old.remove(), 340);
    }
  });

  current = newScreen;
  if (debugOn) newScreen.querySelectorAll('.hotspot').forEach(h => h.classList.add('debug'));

  trail.push(crumbNames[name]);
  if (trail.length > 5) trail.shift();
  document.getElementById('crumbs').textContent = trail.join('  →  ');
}

goTo('onboarding','left');
trail = ['Welcome'];
document.getElementById('crumbs').textContent = trail.join('  →  ');
